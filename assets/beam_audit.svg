<svg xmlns="http://www.w3.org/2000/svg" width="200" height="230.94" viewBox="0 0 200 230.94" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">BeamAudit</title>
  <desc id="logo-description">An Art Deco lighthouse casts a searchlight across dark monoliths, revealing hidden code paths and a highlighted anomaly.</desc>
  <defs>
    <!-- 75% grayscale: 25% original saturation, applied to the entire badge. -->
    <filter id="gray25" x="0" y="0" width="200" height="230.94" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0.25"/>
    </filter>
    <filter id="glow-tight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-wide" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="hex" d="M100 0 200 57.735V173.205L100 230.94 0 173.205V57.735Z"/>
    <clipPath id="hex-clip">
      <use href="#hex"/>
    </clipPath>
    <path id="beam-shape" d="M62 66 200 54V174L62 78Z"/>
